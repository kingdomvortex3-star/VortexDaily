settings:
  prefix: "&8[&bVortexDaily&8] "
  timezone: "Asia/Jakarta"
  reset-hour: 0

  streak-enabled: true
  streak-reset: true

  monthly-reset:
    enabled: true
    day: 1

  gui-title: "&8Daily Rewards"

discord-webhook:
  enabled: true

  url: ""

  username: "VortexDaily"
  avatar-url: ""

  embed:
    color: 5793266
    footer: "VortexDaily • Automatic Reward Notification"

  events:
    daily-claim: true
    weekly-bonus: true
    streak-reset: true

messages:
  no-permission: "&cKamu tidak memiliki permission!"
  already-claimed: "&cKamu sudah mengambil hadiah hari ini!"
  claimed: "&aBerhasil mengambil hadiah Day %day%!"
  streak-info: "&bStreak kamu: &f%streak% hari"
  reload: "&aConfig VortexDaily berhasil dimuat ulang!"
  reset: "&aData Daily %player% berhasil direset!"

gui:
  rows: 6

  filler:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    name: " "

  claim:
    slot: 49
    material: CHEST
    name: "&a&lCLAIM REWARD"
    lore:
      - "&7Klik untuk mengambil hadiah."
      - ""
      - "&eHari berikutnya: &fDay %day%"
      - "&eStreak: &f%streak% hari"

  streak:
    slot: 4
    material: FIREWORK_STAR
    name: "&6&lYOUR STREAK"
    lore:
      - "&7Streak saat ini: &f%streak% hari"
      - "&7Berikutnya: &eDay %day%"

  claimed:
    material: LIME_STAINED_GLASS_PANE
    name: "&a&lDAY %day% &8- &aCLAIMED"
    lore:
      - "&7Hadiah sudah diambil."

  available:
    material: CHEST
    name: "&e&lDAY %day% &8- &eAVAILABLE"
    lore:
      - "&7Hadiah tersedia."
      - "&eKlik CLAIM untuk mengambil."

  locked:
    material: GRAY_STAINED_GLASS_PANE
    name: "&c&lDAY %day% &8- &cLOCKED"
    lore:
      - "&7Selesaikan hari sebelumnya."

